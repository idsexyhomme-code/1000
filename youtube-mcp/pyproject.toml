[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-research-mcp"
version = "0.1.0"
description = "MCP server that lets an AI agent research & monitor YouTube — search, stats, comments, uploads, trending — via the official YouTube Data API v3."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "WorkRadar", email = "idsexyhomme@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "youtube", "youtube-data-api",
            "research", "trending", "social-media", "agent-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []  # zero required deps — built-in stdlib MCP transport

[project.optional-dependencies]
sdk = ["mcp>=1.2.0"]  # optional richer FastMCP path (needs Python 3.10+)

[project.scripts]
youtube-research-mcp = "youtube_mcp:main"

[project.urls]
Repository = "https://github.com/idsexyhomme-code/1000"

[tool.hatch.build.targets.wheel]
include = ["youtube_mcp.py", "youtube_core.py"]

[tool.hatch.build.targets.sdist]
include = ["youtube_mcp.py", "youtube_core.py", "README.md", "LICENSE"]
